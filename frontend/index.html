<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Optional production override; leave empty for localhost / ?api= query. -->
    <meta name="api-base-url" content="">
    <title>Meeting Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Meeting Bot</h1>
            <p>Upload a meeting transcript — or load the sample — and ask about summaries, action items, decisions, topics, and participants.</p>
        </header>

        <div class="main-content">
            <section class="upload-section">
                <h2>Meeting Transcript</h2>
                <textarea
                    id="transcript-input"
                    placeholder="Paste your meeting transcript here..."
                    rows="8"
                ></textarea>
                <div class="upload-actions">
                    <button id="upload-btn" onclick="uploadTranscript()">Upload Transcript</button>
                    <button id="sample-btn" class="secondary" onclick="loadSampleMeeting()">Load sample meeting</button>
                </div>
                <div id="upload-status" class="status-message"></div>
            </section>

            <section class="chat-section">
                <h2>Chat with Assistant</h2>
                <div id="chat-container">
                    <div id="chat-messages"></div>
                    <div class="chat-input-container">
                        <input
                            type="text"
                            id="chat-input"
                            placeholder="Ask about the meeting transcript..."
                            onkeypress="handleChatKeyPress(event)"
                        >
                        <button id="send-btn" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
